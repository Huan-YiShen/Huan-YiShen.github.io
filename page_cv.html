<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV | Huan-Yi Shen</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Huan-Yi Shen</div>
        <div class="topbar-tools">
          <nav class="tabs" aria-label="Main navigation">
            <a class="tab" href="page_intro.html">Intro</a>
            <a class="tab" href="page_projects.html">Projects</a>
            <a class="tab is-active" href="page_cv.html">CV</a>
          </nav>
          <div class="settings-menu">
            <button class="settings-button" type="button" aria-label="Open theme settings" aria-expanded="false" title="Theme settings">Settings</button>
            <div class="settings-dropdown" role="menu" aria-label="Theme options">
              <button class="theme-option" type="button" data-theme="light">Light mode</button>
              <button class="theme-option" type="button" data-theme="dark">Dark mode</button>
            </div>
          </div>
        </div>
      </header>

      <main>
        <section>
          <h2 class="section-heading"></h2>
          <div class="cv-layout">
            <div>
              <div class="cv-card">
                <div class="eyebrow">Tools</div>
                <div class="skills"></div>
              </div>
              <h3> Education </h3>
              <div class="education timeline"></div>
              <h3> Research Experience </h3>
              <div class="research-experience timeline"></div>
              <h3> Work Experience </h3>
              <div class="work-experience timeline"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="js/content-loader.js"></script>
    <script src="js/theme-settings.js"></script>
  </body>
</html>
